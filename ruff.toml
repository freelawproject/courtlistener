extend-exclude = ["**/node_modules"]
line-length = 79
lint.extend-safe-fixes = [
  # non-pep585-annotation
  "UP006",
]
lint.select = [
  # pycodestyle
  "E",
  # Pyflakes errors
  "F",
  # isort
  "I",
  # pyupgrade
  "UP",
  # Pyflakes warnings
  "W",
  # pydocstyle
  "D"
]
lint.ignore = [
  # flake8-bugbear opinionated rules
  "B9",
  # line-too-long
  "E501",
  # suppressible-exception
  "SIM105",
  # if-else-block-instead-of-if-exp
  "SIM108",
  # undocumented-magic-method
  "D105",
  # undocumented-public-nested-class
  "D106",
  # overload-with-docstring
  "D418",
]

[lint.pydocstyle]
convention = "google"

[format]
docstring-code-format = true

[lint.per-file-ignores]
"**/__init__.py" = ["D104"]
# Django reads settings as module attributes, so the settings package
# aggregates its submodules with star imports.
"cl/settings/__init__.py" = ["F403"]
