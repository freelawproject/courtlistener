name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Once codebase is updated, this can easily be changed to any specific version.
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.9.x"

      - name: Install dependencies
        run: uv sync

      # Also runs pyrefly via the local hook in .pre-commit-config.yaml, which
      # needs the dependencies installed above.
      - uses: pre-commit/action@v3.0.1

      - name: Debug paths
        run: |
          pwd
          ls -al

      # The checked modules and files are listed in [tool.pyrefly]
      # project-includes in pyproject.toml; add them there as they're ready.
      # Pre-existing errors are grandfathered in .pyrefly-baseline.json; only
      # new errors fail the check.
      - name: pyrefly Static Type Checker
        run: uv run pyrefly check


