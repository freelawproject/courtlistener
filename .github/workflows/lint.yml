name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Once codebase is updated, this can easily be changed to any specific version.
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.9.x"

      - name: Install dependencies
        run: uv sync

      # Also runs pyrefly via the local hook in .pre-commit-config.yaml, which
      # needs the dependencies installed above.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Debug paths
        run: |
          pwd
          ls -al

      # The checked modules and files are listed in the project-includes of pyrefly.toml;
      # add them there as they're ready.
      # Pre-existing errors are grandfathered in .pyrefly-baseline.json; only
      # new errors fail the check.
      - name: pyrefly Static Type Checker
        run: uv run pyrefly check


