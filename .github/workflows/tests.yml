name: docker build and test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CourtListener
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: courtlistener

      # Build docker image
      - name: Set up docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./courtlistener
          file: ./courtlistener/docker/django/Dockerfile
          push: false # This image is for testing only
          tags: courtlistener:latest
          outputs: type=docker,dest=/tmp/courtlistener.tar
          build-args: |
            BUILD_ENV=dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: courtlistener
          path: /tmp/courtlistener.tar
          compression-level: 0
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    # dorny/test-reporter runs in its default use-actions-summary mode, which
    # writes the report to the job summary rather than creating a check run, so
    # it needs no write scopes. Declared explicitly to keep the token
    # least-privilege regardless of the repo-wide default.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tag_flags: ["--exclude-tag selenium", "--tag selenium"]
    steps:
      - name: Check out CourtListener
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: courtlistener

      - name: Create the .env settings file
        working-directory: courtlistener/
        run: cp .env.example .env.dev
      - name: Update .env.dev file
        working-directory: courtlistener/
        run: |
          echo 'SECRET_KEY=Verbal-Kint-is-Keyser-Soze' >> .env.dev
          echo 'ALLOWED_HOSTS=*' >> .env.dev

      - name: Echo github actor name for debugging
        run: echo ${{ github.actor }}

      - name: Set up docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: network=host

      # Prepare Docker images
      - name: Pull docker images
        working-directory: courtlistener/docker/courtlistener
        run: docker compose pull --quiet --ignore-buildable
      - name: Download courtlistener image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: courtlistener
          path: /tmp
      - name: Load courtlistener image
        run: docker load --input /tmp/courtlistener.tar
      - name: Build cl-postgresql images # TODO: replace with an off-the-shelf image. Until then, build now for later steps.
        working-directory: courtlistener/docker/courtlistener
        run: docker compose build cl-postgresql
      - name: List docker images
        run: docker image ls -a --no-trunc

      # Docker images are ready. Start them up.
      - name: Create docker network
        run: docker network create -d bridge --attachable cl_net_overlay
      - name: Start docker containers
        working-directory: courtlistener/docker/courtlistener
        run: > # don't build, rather use loaded image from build step, specified by merging overriding config
          docker compose -f docker-compose.yml -f docker-compose.tmpfs.yml -f <(echo 'services: { cl-django: { image: "courtlistener" }, cl-celery: { image: "courtlistener" } }') up -d --no-build --pull=never
      - name: List docker containers
        run: docker ps -a --no-trunc
      - name: Show the docker startup logs
        working-directory: courtlistener/docker/courtlistener
        run: docker compose logs

      # Run the checks and tests
      - name: Check if migrations are missing
        run: docker exec cl-django ./manage.py makemigrations --check --dry-run
      - name: Run the tests!
        id: tests
        continue-on-error: true
        run: >
          docker exec -e SELENIUM_DEBUG=1 -e SELENIUM_TIMEOUT=30 cl-django
          ./manage.py test
          cl --verbosity=2 ${{ matrix.tag_flags }} --parallel --xml-output /tmp/test-results
      - name: Export selenium results from docker to host
        if: steps.tests.outcome == 'failure'
        run: |
          # This is annoying b/c docker cp doesn't support globs. See:
          # https://stackoverflow.com/q/35806102/
          # https://github.com/moby/moby/issues/7710
          mkdir selenium-screenshots
          docker exec cl-django bash -c "mkdir /extract && mv /tmp/*-selenium.png /extract ||:"
          docker cp 'cl-django:/extract' selenium-screenshots/
      - name: Save selenium screenshot as Github artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.tests.outcome == 'failure'
        with:
          name: selenium-screenshots
          path: selenium-screenshots/extract
          if-no-files-found: ignore
      - name: Export test results from docker to host
        if: always()
        # There is nothing to copy if the tests never ran -- the stack failed
        # to come up, say -- and docker cp exits non-zero when the source is
        # missing. Swallow that so this step doesn't pile a second, misleading
        # failure on top of the real one. An empty result set still surfaces:
        # the Test Report step below fails on it.
        run: docker cp 'cl-django:/tmp/test-results' courtlistener/test-results || true
      - name: Save test results as Github artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-${{ strategy.job-index }}
          path: courtlistener/test-results/
          if-no-files-found: ignore
      - name: Retry the tests
        id: retry
        if: steps.tests.outcome == 'failure'
        continue-on-error: true
        run: >
          docker exec -e SELENIUM_DEBUG=1 -e SELENIUM_TIMEOUT=30 cl-django
          ./manage.py test
          cl --verbosity=2 ${{ matrix.tag_flags }} --parallel --keepdb --xml-output /tmp/test-results-retry
      - name: Export retry results from docker to host
        if: always() && steps.retry.conclusion != 'skipped'
        run: docker cp 'cl-django:/tmp/test-results-retry' courtlistener/test-results-retry || true
      - name: Save retry results as Github artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.retry.conclusion != 'skipped'
        with:
          name: test-results-retry-${{ strategy.job-index }}
          path: courtlistener/test-results-retry/
          if-no-files-found: ignore
      - name: Report the retry verdict
        if: always() && steps.retry.conclusion != 'skipped'
        run: |
          if [ "${{ steps.retry.outcome }}" = "success" ]; then
            headline="Flaky tests: the suite passed when re-run on the same code."
            # A warning, not a notice: the build is about to go green, and
            # this annotation is the only thing that says why it shouldn't
            # have needed two tries.
            level=warning
          else
            headline="The failures survived a second run of the same code."
            level=error
          fi
          {
            echo "### Retry verdict"
            echo
            echo "**${headline}**"
            echo
            echo "Compare the two reports in the test-results-${{ strategy.job-index }}"
            echo "and test-results-retry-${{ strategy.job-index }} artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
          # Echoing a workflow command turns the headline into an annotation
          # on the run and, for a PR, on its Checks tab.
          echo "::${level} title=Retry verdict::${headline}"

      # Safe on fork PRs: writing the job summary needs no token scopes, so the
      # read-only GITHUB_TOKEN GitHub forces there is enough. Flip
      # use-actions-summary off and this becomes a check run, which needs
      # checks:write above and will 403 on forks.
      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Test Results (${{ matrix.tag_flags }})
          path: test-results/*.xml
          reporter: java-junit
          working-directory: courtlistener
          fail-on-error: false
      - name: Decide whether this run passed
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            exit 0
          fi
          if [ "${{ steps.retry.outcome }}" = "success" ]; then
            echo "The suite passed when re-run on the same code, so the"
            echo "failures were flaky. Passing the run; both reports are in"
            echo "the job's artifacts."
            exit 0
          fi
          echo "Tests failed. See the job summary for what the retry made of it."
          exit 1


# Cancel the current workflow (tests) for pull requests (head_ref) only. See:
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
