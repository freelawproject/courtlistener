# CourtListener development stack.
#
# This is for development only. It is not secure enough for production and
# it stores data in ways that would be a bad idea there.
#
# Quick start (see README.md next to this file for the details):
#
#     cp .env.example .env.dev            # then set ALLOWED_HOSTS and SECRET_KEY
#     docker compose up --wait            # from the repository root, or from here
#     docker exec cl-django ./manage.py make_dev_data
#
# `--wait` blocks until every service with a healthcheck reports healthy, so
# when it returns the site is answering on http://localhost:8000.
#
# Host ports can be moved if they collide with something already running on
# your machine, e.g. `CL_POSTGRES_PORT=5433 docker compose up`.
name: courtlistener

networks:
  cl_net_overlay:
    # Compose creates this network and gives it a fixed name so that every
    # service has a stable hostname (cl-postgres, cl-redis, cl-es, ...).
    # If you created it by hand under the old instructions, remove it once
    # with `docker network rm cl_net_overlay` so compose can own it.
    name: cl_net_overlay
    driver: bridge
    attachable: true

services:
  # Redis for caching
  cl-redis:
    container_name: cl-redis
    image: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - cl_net_overlay

  # Database (postgresql)
  # During tests this will be automatically migrated for you. In regular use
  # the cl-django container runs the migrations for you when it starts.
  cl-postgresql:
    container_name: cl-postgres
    build:
      context: "${CL_BASE_DIR:-../../}/docker/postgresql"
      dockerfile: "./Dockerfile"
      args:
        POSTGRES_VERSION: 15.2-alpine
    ports:
      - "${CL_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "courtlistener"
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/ssl/private/cl-postgres.crt"
      - "-c"
      - "ssl_key_file=/etc/ssl/private/cl-postgres.key"
    healthcheck:
      # Check over TCP rather than the unix socket: while the image runs its
      # first-boot init scripts, a temporary server listens on the socket
      # only, and we must not report healthy until the real one is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d courtlistener"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - cl_net_overlay

  cl-webpack:
    container_name: cl-webpack
    image: node:16
    volumes:
      - ${CL_BASE_DIR:-../../}:/opt/courtlistener
    env_file:
      - ../../.env.dev
    working_dir: /opt/courtlistener/cl
    command: sh -c 'npm install && exec npx webpack --progress --watch --mode=development'
    healthcheck:
      test: sh -c 'ps aux | grep -v grep | grep webpack >/dev/null 2>&1 && echo 0 || echo 1'
      interval: 1s
      retries: 45
      start_period: 1s
      timeout: 1s

  # Task Server
  cl-celery:
    container_name: cl-celery
    build:
      context: "${CL_BASE_DIR:-../../}"
      dockerfile: "./docker/django/Dockerfile"
      args:
        BUILD_ENV: dev
    command: celery
    depends_on:
      cl-postgresql:
        condition: service_healthy
      cl-redis:
        condition: service_healthy
      cl-doctor:
        condition: service_started
      cl-disclosures:
        condition: service_started
    volumes:
      - ${CL_POSTGRES_RUN_DIR:-/var/run/postgresql}:/var/run/postgresql
      - ${CL_BASE_DIR:-../../}:/opt/courtlistener
    networks:
      - cl_net_overlay
    env_file:
      - ../../.env.dev
    environment:
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
        - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
        - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
        - AWS_DEV_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
        - AWS_DEV_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}

  cl-tailwind-reload:
    container_name: cl-tailwind-reload
    working_dir: /opt/courtlistener/cl
    image: node:16
    volumes:
      - ${CL_BASE_DIR:-../../}:/opt/courtlistener
    env_file:
      - ../../.env.dev
    command: sh -c 'npm run dev'
    depends_on:
      cl-webpack:
        condition: service_healthy
    tty: true

  cl-django:
    container_name: cl-django
    build:
      context: "${CL_BASE_DIR:-../../}"
      dockerfile: "./docker/django/Dockerfile"
      args:
        BUILD_ENV: dev
    command: web-dev
    depends_on:
      # Django migrates the database on startup, so it needs postgres and
      # redis to actually be accepting connections, not merely started.
      # Elasticsearch is slow to boot and the test suite needs it, so wait
      # for it too; that way `up --wait` means "ready to run tests".
      cl-postgresql:
        condition: service_healthy
      cl-redis:
        condition: service_healthy
      cl-es:
        condition: service_healthy
      cl-celery:
        condition: service_started
      cl-selenium:
        condition: service_started
      cl-doctor:
        condition: service_started
      cl-disclosures:
        condition: service_started
    ports:
      - "${CL_DJANGO_PORT:-8000}:8000"
    user: root
    volumes:
      - ${CL_POSTGRES_RUN_DIR:-/var/run/postgresql}:/var/run/postgresql
      - ${CL_BASE_DIR:-../../}:/opt/courtlistener
      - ${CL_BASE_DIR:-../../}/.postgresql:/root/.postgresql
    networks:
      - cl_net_overlay
    env_file:
      - ../../.env.dev
    environment:
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
        - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
        - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
        - AWS_DEV_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
        - AWS_DEV_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    healthcheck:
      # Healthy once runserver answers at all. Any HTTP status counts (no
      # -f), because a 400 from ALLOWED_HOSTS still proves the server is up
      # and migrations have finished.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8000/"]
      interval: 10s
      timeout: 10s
      retries: 30
      # First boot runs every migration, which can take a few minutes.
      start_period: 300s

  cl-selenium:
    container_name: cl-selenium
    image: seleniarm/standalone-chromium:124.0
    ports:
      - "${CL_VNC_PORT:-5900}:5900"  # VNC server
    volumes:
      - ${CL_SHM_DIR:-/dev/shm}:/dev/shm
    networks:
      - cl_net_overlay
    environment:
      - JAVA_OPTS=-Dwebdriver.chrome.whitelistedIps=

  cl-doctor:
    image: freelawproject/doctor:latest
    container_name: "cl-doctor"
    networks:
      - cl_net_overlay

  cl-disclosures:
    image: freelawproject/disclosure-extractor:latest
    container_name: "cl-disclosures"
    networks:
      - cl_net_overlay

  cl-webhook-sentry:
    image: juggernaut/webhook-sentry:latest
    container_name: "cl-webhook-sentry"
    networks:
      - cl_net_overlay

  cl-es:
    container_name: cl-es
    image: elastic/elasticsearch:9.3.1
    environment:
      - discovery.type=single-node
      - cluster.name=courtlistener-cluster
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/cl-es.key
      - xpack.security.http.ssl.certificate=certs/cl-es.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/cl-es.key
      - xpack.security.transport.ssl.certificate=certs/cl-es.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - ELASTIC_PASSWORD=password
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: 500
        hard: 600
    volumes:
      - ${CL_BASE_DIR:-../../}/docker/elastic/cl-es.crt:/usr/share/elasticsearch/config/certs/cl-es.crt
      - ${CL_BASE_DIR:-../../}/docker/elastic/cl-es.key:/usr/share/elasticsearch/config/certs/cl-es.key
      - ${CL_BASE_DIR:-../../}/docker/elastic/ca.crt:/usr/share/elasticsearch/config/certs/ca.crt
      - ${CL_BASE_DIR:-../../}/cl/search/elasticsearch_files/synonyms_en.txt:/usr/share/elasticsearch/config/dictionaries/synonyms_en.txt
      - ${CL_BASE_DIR:-../../}/cl/search/elasticsearch_files/stopwords_en.txt:/usr/share/elasticsearch/config/dictionaries/stopwords_en.txt
    ports:
      - "${CL_ES_PORT:-9200}:9200"
    networks:
      - cl_net_overlay
    healthcheck:
      # The dev cert is self-signed, hence -k. Yellow is fine for a single
      # node: it only means replicas can't be allocated anywhere.
      test: ["CMD-SHELL", "curl -fsk -u elastic:password 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
