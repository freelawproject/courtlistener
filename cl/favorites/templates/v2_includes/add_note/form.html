{# The note form returned to htmx after a save attempt, replacing the form on the page. #}
{% load component_tags %}

<c-add-note.form :form="form" />

{% if update_trigger %}
    {# Out-of-band: refreshes the note button's icon and label in place. #}
    <span id="note-trigger-{{ form.content_type.value }}-{{ form.object_id.value }}" hx-swap-oob="innerHTML">
        <c-add-note.button_content :form="form" />
    </span>
{% endif %}
