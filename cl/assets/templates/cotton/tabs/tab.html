{% load svg_tags %}

<c-vars tab tabs_id="" active_tab="" />

{% if tab.url %}
<li class="text-greyscale-600 {% if tab.key == active_tab %}border-b-2{% endif %}">
  <a
    href="{{ tab.url }}"
    class="flex gap-2 pt-1 pb-3 py-[10px]"
    {% if tab.key == active_tab %} aria-current="page"{% endif %}
    id="{{ tabs_id }}-tab-{{ tab.key }}"
  >
    <span class="{% if tab.key == active_tab %}text-greyscale-900{% endif %}">{{ tab.label }}</span>
    {% if tab.icon %}
      {% svg tab.icon aria_hidden="true" %}
    {% endif %}
  </a>
</li>
{% else %}
  <button
    type="button"
    role="tab"
    id="{{ tabs_id }}-tab-{{ tab.key }}"
    aria-controls="{{ tabs_id }}-panel-{{ tab.key }}"
    aria-selected="{% if tab.key == active_tab %}true{% else %}false{% endif %}"
    tabindex="{% if tab.key == active_tab %}0{% else %}-1{% endif %}"
    data-tab-key="{{ tab.key }}"
    x-bind:aria-selected="isSelected"
    x-bind:tabindex="tabIndex"
    x-on:click="selectTab"
    x-on:focus="selectTab"
  >
    {{ tab.label }}
    {% if tab.count %}
      <span class="rounded-full bg-greyscale-200 p-[2px]">{{ tab.count }}</span>
    {% endif %}
  </button>
{% endif %}
