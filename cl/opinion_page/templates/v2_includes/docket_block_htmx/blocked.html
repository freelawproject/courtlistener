{# Out-of-band response to the Block button. It replaces only the contents of nodes already on the docket page, so the live region survives the swap. The badge takes the button's id, so htmx moves focus from the removed button to it. #}
<span id="docket-block-{{ docket.pk }}" hx-swap-oob="innerHTML">
  <c-badge variant="danger" id="docket-block-control-{{ docket.pk }}" tabindex="-1">Blocked</c-badge>
</span>
<span id="docket-block-status-{{ docket.pk }}" hx-swap-oob="innerHTML">This docket is now blocked.</span>
