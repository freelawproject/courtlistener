{# Out-of-band response to the Block button: fills the badge and status nodes already on the docket page. The badge takes the button's id, which is where htmx moves focus. #}
<span id="docket-block-{{ docket.pk }}" hx-swap-oob="innerHTML">
  <c-badge variant="danger" id="docket-block-control-{{ docket.pk }}" tabindex="-1">Blocked</c-badge>
</span>
<span id="docket-block-status-{{ docket.pk }}" hx-swap-oob="innerHTML">This docket is now blocked.</span>
