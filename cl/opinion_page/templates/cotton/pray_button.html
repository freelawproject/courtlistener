{% load component_tags %}
{% require_script "js/third_party/htmx" defer=True %}

<c-vars
  document_id=""
  count="0"
  prayer_exists=""
  daily_limit_reached=""
  class=""
/>

{# This wrapper was created for accessibility; now the status region keeps its identity and screen readers announce its text changes. #}
<div class="inline-flex items-center {{ class }}">
  <c-pray-button-form
    :document_id="document_id"
    :count="count"
    :prayer_exists="prayer_exists"
    :daily_limit_reached="daily_limit_reached"
  />
  <span id="pray_status_{{ document_id }}" class="sr-only" role="status"></span>
</div>
