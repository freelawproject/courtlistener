{# Most Texas documents are downloaded from TAMES after their entry is merged, so a missing file usually means we don't have it yet rather than that it was sealed. #}
<div class="flex flex-column flex-sm-row row-gap-3 alert-warning alert justify-content-between">
  <div class="col-sm-12">
    <p class="bottom">
      <i class="fa fa-info-circle"></i> We don't have a copy of this document yet.
    </p>
  </div>
  {% if rd.external_url %}
    <div class="col-sm-12 flex flex-row gap-2 justify-content-end">
      <a class="btn btn-primary btn-sm"
         href="{{ rd.external_url }}"
         rel="nofollow noopener noreferrer"
         target="_blank">View on TAMES</a>
    </div>
  {% endif %}
</div>
