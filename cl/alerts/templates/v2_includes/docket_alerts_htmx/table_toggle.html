{% load text_filters %}
<span id="docket-alert-row-toggle-{{ docket.pk }}" hx-swap-oob="innerHTML">
  {% if has_alert %}
    <c-icon name="bell_slash" />
    <span class="sr-only">Disable alert for {{ docket|best_case_name }}</span>
  {% else %}
    <c-icon name="bell_plus" />
    <span class="sr-only">Enable alert for {{ docket|best_case_name }}</span>
  {% endif %}
</span>
<span id="docket-alerts-status" hx-swap-oob="innerHTML">{{ message }}: {{ docket|best_case_name }}</span>
