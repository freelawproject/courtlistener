  "django-markdown-deux>=1.0.6",
  "django-mathfilters",
  "django-pghistory>=3.9.1",
  "django-ratelimit>=4.1.0",
  "django-storages>=1.14.6",
  "djangorestframework>=3.17.1",
  "djangorestframework-xml>=2.0.0",
  "feedparser>=6.0.12",
  "httplib2>=0.32.0",
  "internetarchive>=5.7.1",
  "ipaddress>=1.0.16",
  "itypes>=1.1.0",
  "kombu>=5.5.1",
  "lxml>=6.1.1",
  "markdown2>=2.5.4",
  "natsort>=8.4.0",
  "ndg-httpsclient>=0.5.1",
